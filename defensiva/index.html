<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />

    <title>Defensiva LVBP Venevisión</title>

    <style>

        #bm {
            position: fixed;
        }

        /* Equipo oculto hasta que el UPDATE mande su _opacidad (el inline gana) */
        .AGUI_opacidad, .ANZ_opacidad, .BRAVOS_opacidad, .CARD_opacidad,
        .LEO_opacidad, .MAGA_opacidad, .TIBUS_opacidad, .TIGRES_opacidad {
            opacity: 0;
        }

        /* El escudo de las compuertas va al 49 % del diseño. En la capa no: el UPDATE escribe
           ahí su _opacidad y lo pisaría con un 1 (herramientas/prep.js) */
        g[id^="puerta"] > image {
            opacity: 0.49;
        }

        body {
            overflow: hidden;
            margin: 0;

        }
    </style>
</head>

<body>
