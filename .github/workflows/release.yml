# Crea el release de GitHub (y su tag) cuando release.sh pushea la rama release/<versión>, y borra
# esa rama. El zip del release ("Source code (zip)") es el artefacto que se copia al playout: lo
# genera GitHub desde el tag, recortado por .gitattributes.
#
# Va por una rama y no por el tag porque una sesión de Claude Code en la nube puede pushear ramas
# pero no tags ni releases. También corre si llega un tag v* pusheado a mano. Si el release ya
# existe, no lo toca.
name: Release

on:
  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/release/*) TAG="${GITHUB_REF#refs/heads/release/}" ;;
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
          esac
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$'; then
            echo "Versión inválida: $TAG"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "El release $TAG ya existe: no hay nada que hacer"
          else
            pre=""
            case "$TAG" in *-pre.*) pre="--prerelease" ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes $pre
          fi
          case "$GITHUB_REF" in
            refs/heads/release/*) gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/$TAG" ;;
          esac
